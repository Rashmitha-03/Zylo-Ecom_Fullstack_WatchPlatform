# --- USER2's src/main/resources/application.properties ---

# Application Name (CRITICAL: Must match Gateway's 'lb://user2' in lowercase)
spring.application.name=user3

# Server Port for the User Microservice
server.port=7003

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/product
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Eureka Instance Configuration (for hostname resolution)
# This is where we tell Eureka how USER2 should register itself.
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
# If 'localhost' still doesn't work, you can try: eureka.instance.ip-address=127.0.0.1


# --- Springdoc OpenAPI Configuration ---
# IMPORTANT: Removed 'springdoc.servers.url'
# Springdoc should infer the correct base URL from the incoming request (which will be from the Gateway).
# Setting 'springdoc.servers.url' to a specific port like 8079 (if your service runs on 7003)
# or any URL other than your Gateway's URL (8003) can cause issues.
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# springdoc.swagger-ui.path=/swagger-ui.html (this is the default and usually doesn't need to be set)

# Configure the JWT Resource Server with the Base64-encoded symmetric secret key
spring.security.oauth2.resourceserver.jwt.base64-secret=eW91clZlcnlMb25nQW5kU2VjdXJlSldUU2VjcmV0S2V5SGVyZVRoYXRTaG91bGRCZUF0TGVhc3QzMkJ5dGVzRm9ySFMyNTZFbmNyeXB0aW9u

# --- Spring Boot Application Properties for Logging ---
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN
logging.level.com.cts.service=DEBUG
logging.level.com.cts.repository=DEBUG
logging.level.com.cts.controller=DEBUG


logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) %cyan(${spring.application.name}:%logger{36}) - %msg%n
logging.file.name=logs/${spring.application.name}.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level ${spring.application.name}:%logger{36} - %msg%n