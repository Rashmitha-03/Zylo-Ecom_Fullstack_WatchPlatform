spring.application.name=authservice1
# Application Name
server.port=7004

# Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# JWT Secret Key (VERY IMPORTANT!)
# This key should be strong and kept secret. Use a more secure generation method in production.
# For local testing, a base64 encoded string of sufficient length is fine.
# Example: echo "your-super-secret-jwt-key-that-is-long-enough" | base64
jwt.secret=yourVeryLongAndSecureJWTSecretKeyHereThatShouldBeAtLeast32BytesForHS256Encryption

# JWT Expiration Time (in milliseconds) - 1 hour
jwt.expiration=3600000

# Feign Client Configuration for User Service
# Base URL for the user2 service when called via API Gateway or directly via Eureka LB
user-service.url=http://user3

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.cts=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) %cyan(${spring.application.name}:%logger{36}) - %msg%n
logging.file.name=logs/${spring.application.name}.log