spring.application.name=CartModule

server.port=9926
spring.datasource.url=jdbc:mysql://localhost:3306/product
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# This will update wheather we have that table or not. If table is not there, it will create, else it won't
spring.jpa.hibernate.ddl-auto = create
 
# It will show the schema in console
spring.jpa.show-sql=false  
 
#This will formate the output in console
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html

logging.level.root = info
logging.pattern.console=%d{yyyy-MM-dd} - %msg%n
logging.file.name= app.log
logging.pattern.file=%d{yyyy-MM-dd} -%msg%n


eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true


