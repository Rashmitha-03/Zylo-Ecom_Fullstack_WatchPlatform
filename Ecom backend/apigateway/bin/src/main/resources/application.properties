# Gateway Application Name and Port
spring.application.name=apigateway3
server.port=8003

# Eureka Client Configuration for Gateway
eureka.instance.prefer-ip-ip-address=true
eureka.instance.hostname=localhost
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Gateway Discovery Locator Configuration (Using updated property names)
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lowerCaseServiceId=true

# --- AUTH SERVICE ROUTES ---
# Assuming your auth-service has spring.application.name=authservice1 and AuthController maps to /api/auth
spring.cloud.gateway.server.webflux.routes[0].id=auth-service-api-route
# CHANGE: The URI must match the exact service ID registered in Eureka
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTHSERVICE1 
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
# No RewritePath filter here, assuming AuthController expects the full /api/auth path. (This route is correct)

# --- USER SERVICE ROUTES ---
# IMPORTANT: This assumes your user2 controller is mapped to @RequestMapping("/api/v1/users") and "/api/v1/addresses")
spring.cloud.gateway.server.webflux.routes[1].id=user3-users-api-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://user3
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/users/**
# Removed RewritePath filter, as user2 service is assumed to handle /api/v1/users directly.

spring.cloud.gateway.server.webflux.routes[2].id=user3-addresses-api-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://user3
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/addresses/**
# Removed RewritePath filter, as user2 service is assumed to handle /api/v1/addresses directly.

# --- CARTMODULE ROUTES ---
# Assuming your cartmodule service has spring.application.name=CartModule and expects /api/v1/cart
spring.cloud.gateway.server.webflux.routes[3].id=cartmodule-api-route
spring.cloud.gateway.server.webflux.routes[3].uri=lb://CartModule
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/cart/**
# No RewritePath filter here.

# --- PRODUCT ROUTES ---
# Assuming your product service has spring.application.name=Project and expects /api/v1/products
spring.cloud.gateway.server.webflux.routes[4].id=product-api-route
spring.cloud.gateway.server.webflux.routes[4].uri=lb://Project
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/ecom/**
# Removed RewritePath filter.

# --- ORDER SERVICE ROUTES ---
spring.cloud.gateway.server.webflux.routes[5].id=order-service-api-route
spring.cloud.gateway.server.webflux.routes[5].uri=lb://orderService
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/orders/**
 
# --- PAYMENT SERVICE ROUTES ---
spring.cloud.gateway.server.webflux.routes[6].id=payment-service-api-route
spring.cloud.gateway.server.webflux.routes[6].uri=lb://payment
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/payments/**


# --- SWAGGER/OPENAPI AGGREGATION ---
# Configuration for the Swagger UI to display multiple service documentations.
# Access via http://localhost:8003/swagger-ui.html

# Auth Service API documentation URL
springdoc.swagger-ui.urls[0].name=Auth Service API
# CHANGE: This URL path prefix must match the new path for the OpenAPI route
springdoc.swagger-ui.urls[0].url=/authservice1/v3/api-docs 

# User Service API documentation URL (assuming it also uses v3/api-docs now)
springdoc.swagger-ui.urls[1].name=User Service API
springdoc.swagger-ui.urls[1].url=/user3/v3/api-docs

# Cart Service API documentation URL
springdoc.swagger-ui.urls[2].name=Cart Service API
springdoc.swagger-ui.urls[2].url=/cartmodule/v3/api-docs

# Product Service API documentation URL
springdoc.swagger-ui.urls[3].name=Product Service API
springdoc.swagger-ui.urls[3].url=/project/v3/api-docs


springdoc.swagger-ui.urls[4].name=Order Service API
springdoc.swagger-ui.urls[4].url=/orderService/v3/api-docs
 
springdoc.swagger-ui.urls[5].name=Payment Service API
springdoc.swagger-ui.urls[5].url=/payment/v3/api-docs


# --- OPENAPI DOCUMENTATION ROUTES (for Gateway to serve docs from services) ---
# These routes now include the RewritePath filter to strip the service ID prefix
# before forwarding to the actual service's /v3/api-docs or /api-docs endpoint.

# Route for Auth Service's OpenAPI definition
spring.cloud.gateway.server.webflux.routes[7].id=auth-service-openapi-route
# CHANGE: The URI must match the exact service ID registered in Eureka
spring.cloud.gateway.server.webflux.routes[7].uri=lb://AUTHSERVICE1 
# CHANGE: The Path predicate must match the new URL path prefix
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/authservice1/v3/api-docs/**
# CHANGE: The RewritePath filter must use the new URL path prefix
spring.cloud.gateway.server.webflux.routes[7].filters[0]=RewritePath=/authservice1(?<segment>.*), ${segment}

# Route for User Service's OpenAPI definition
spring.cloud.gateway.server.webflux.routes[8].id=user3-openapi-route
spring.cloud.gateway.server.webflux.routes[8].uri=lb://user3
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/user3/v3/api-docs/** 
spring.cloud.gateway.server.webflux.routes[8].filters[0]=RewritePath=/user3(?<segment>.*), ${segment}

# Route for Cart Service's OpenAPI definition
spring.cloud.gateway.server.webflux.routes[9].id=cartmodule-openapi-route
spring.cloud.gateway.server.webflux.routes[9].uri=lb://CartModule
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/cartmodule/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[9].filters[0]=RewritePath=/cartmodule(?<segment>.*), ${segment}

# Route for Product Service's OpenAPI definition
spring.cloud.gateway.server.webflux.routes[10].id=product-openapi-route
spring.cloud.gateway.server.webflux.routes[10].uri=lb://Project
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/project/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[10].filters[0]=RewritePath=/project(?<segment>.*), ${segment}


spring.cloud.gateway.server.webflux.routes[11].id=order-openapi-route
spring.cloud.gateway.server.webflux.routes[11].uri=lb://orderService
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/orderService/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[11].filters[0]=RewritePath=/orderService(?<segment>.*), ${segment}
 
spring.cloud.gateway.server.webflux.routes[12].id=payment-openapi-route
spring.cloud.gateway.server.webflux.routes[12].uri=lb://payment
spring.cloud.gateway.server.webflux.routes[12].predicates[0]=Path=/payment/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[12].filters[0]=RewritePath=/payment(?<segment>.*), ${segment}



jwt.secret=yourVeryLongAndSecureJWTSecretKeyHereThatShouldBeAtLeast32BytesForHS256Encryption

# JWT Expiration Time (Not strictly needed for validation, but good to have consistent)
# If using `isTokenExpired`, then the JwtUtil in gateway will rely on the token's `exp` claim itself.
jwt.expiration=3600000

# Logging for filter
logging.level.com.cts.apigateway.filter=DEBUG

jwt.public-paths= \
    /authservice1/api/auth/**, \
    /authservice1/v3/api-docs/**, \
    /authservice1/swagger-ui/**, \
    /user3/v3/api-docs/**, \
    /user3/swagger-ui/**, \
    /project/v3/api-docs/**, \
    /project/swagger-ui/**, \
    /cartmodule/v3/api-docs/**, \
    /cartmodule/swagger-ui/**, \
    /eureka/**, \
    /webjars/**, \
    /api/auth/**, \
    /api/ecom/getAllProducts, \
    /api/ecom/getProductById/**, \
    /api/ecom/searchByName, \
    /api/ecom/filter, \
    /api/ecom/products/getStockAvailability, \
    /api/ecom/products/getProductForCart, \
    /api/ecom/products/getSummaries, \
    /api/ecom/products/**/getFeedbackByProduct,\
    /api/v1/users/forgot-password,\
    /api/v1/users/reset-password,\
    /orderService/v3/api-docs/**, \
    /orderService/swagger-ui/**, \
    /api/auth/**, \
    /payment/v3/api-docs/**, \
    /payment/swagger-ui/**


 
